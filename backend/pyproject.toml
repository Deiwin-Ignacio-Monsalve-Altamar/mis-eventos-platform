[project]
name = "mis-eventos-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Deiwin Monsalve",email = "deiwin1987@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "flasgger (>=0.9.7.1,<0.10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.10,<0.17.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: combines application components with mocked infrastructure",
]
