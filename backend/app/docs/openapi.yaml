
openapi: 3.0.3
info:
  title: Mis Eventos API
  version: 1.0.0
  description: |
    API for managing accounts, events, sessions, and attendee registrations.
    Routes use the /api/v1 prefix.
servers:
  - url: /api/v1
    description: Local development server

tags:
  - name: Health
    description: Service health status
  - name: Authentication
    description: Account registration, sign-in, and profile
  - name: Events
    description: Event management and discovery
  - name: Registrations
    description: Event registrations
  - name: Sessions
    description: Session and attendee management
  - name: Administration
    description: Restricted role administration

components:
  securitySchemes:
    AccessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: The request contains invalid fields.

    ConcurrencyConflict:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, current_version]
          properties:
            code:
              type: string
              example: concurrency_conflict
            message:
              type: string
            current_version:
              type: integer
              nullable: true
              example: 2

    User:
      type: object
      required: [id, email, first_name, last_name, role]
      properties:
        id:
          type: integer
          example: 7
        email:
          type: string
          format: email
          example: user@example.com
        first_name:
          type: string
          example: Alex
        last_name:
          type: string
          example: Rivera
        role:
          type: string
          enum: [ATTENDEE, ORGANIZER, ADMIN]
          example: ATTENDEE

    Event:
      type: object
      required:
        - id
        - title
        - description
        - location
        - starts_at
        - ends_at
        - capacity
        - status
        - version
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          maxLength: 200
          example: Backend Developers Meetup
        description:
          type: string
          nullable: true
          example: A technical community event.
        location:
          type: string
          nullable: true
          maxLength: 255
          example: Medellín
        starts_at:
          type: string
          format: date-time
          example: "2026-11-01T09:00:00+00:00"
        ends_at:
          type: string
          format: date-time
          example: "2026-11-01T11:00:00+00:00"
        capacity:
          type: integer
          minimum: 1
          example: 50
        status:
          type: string
          enum: [draft, published, cancelled, completed]
          example: published
        version:
          type: integer
          example: 1

    Session:
      type: object
      required:
        - id
        - event_id
        - title
        - description
        - starts_at
        - ends_at
        - capacity
        - speaker_ids
        - version
      properties:
        id:
          type: integer
          example: 1
        event_id:
          type: integer
          example: 1
        title:
          type: string
          maxLength: 200
          example: Introduction to Go
        description:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
          example: "2026-11-01T09:00:00+00:00"
        ends_at:
          type: string
          format: date-time
          example: "2026-11-01T10:00:00+00:00"
        capacity:
          type: integer
          minimum: 1
          example: 20
        speaker_ids:
          type: array
          items:
            type: integer
          example: [2]
        version:
          type: integer
          example: 1

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3

paths:
  /health:
    get:
      tags: [Health]
      summary: Check service health
      responses:
        "200":
          description: Health status returned.

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email:
                  type: string
                  format: email
                  example: attendee@example.com
                password:
                  type: string
                  format: password
                  example: correct-horse-battery
                first_name:
                  type: string
                  example: Alex
                last_name:
                  type: string
                  example: Rivera
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Account already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and set the access-token cookie
      description: |
        The response sets an HttpOnly access_token cookie.
        Its Secure flag depends on the application configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: attendee@example.com
                password:
                  type: string
                  format: password
                  example: correct-horse-battery
      responses:
        "200":
          description: Authentication succeeded; access-token cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly access_token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Current user returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Authentication required or token invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: End the current browser session
      description: Expires the access-token cookie. It does not delete the account or its data.
      responses:
        "204":
          description: The access-token cookie was expired.

  /admin/users:
    get:
      tags: [Administration]
      summary: List users for administrator role management
      description: Returns minimal identity fields in a searchable, paginated directory. Requires an administrator.
      security:
        - AccessTokenCookie: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: q
          description: Case-insensitive match against first name, last name, full name, or email (up to 200 characters).
          schema: {type: string, maxLength: 200}
      responses:
        "200":
          description: One page of user summaries.
          content:
            application/json:
              schema:
                type: object
                required: [users, pagination]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/User"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400":
          description: Invalid pagination or search query.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: Administrator role required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /admin/dashboard:
    get:
      tags: [Administration]
      summary: Get aggregate platform metrics
      description: Returns role, event, registration, monthly activity, and organizer aggregates. Requires an administrator.
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Real platform-wide aggregate metrics.
          content:
            application/json:
              schema:
                type: object
                required: [dashboard]
                properties:
                  dashboard:
                    type: object
                    required: [summary, event_creation_by_month, registration_activity_by_month, organizer_activity]
                    properties:
                      summary:
                        type: object
                        description: User role counts, event lifecycle totals, and registration status counts.
                      event_creation_by_month:
                        type: array
                        maxItems: 6
                        items:
                          type: object
                          required: [month, count]
                          properties:
                            month: {type: string, pattern: '^\d{4}-\d{2}$'}
                            count: {type: integer, minimum: 0}
                      registration_activity_by_month:
                        type: array
                        maxItems: 6
                        items:
                          type: object
                          required: [month, count]
                          properties:
                            month: {type: string, pattern: '^\d{4}-\d{2}$'}
                            count: {type: integer, minimum: 0}
                      organizer_activity:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          required: [user_id, name, event_count, active_registrations]
                          properties:
                            user_id: {type: integer}
                            name: {type: string}
                            event_count: {type: integer, minimum: 0}
                            active_registrations: {type: integer, minimum: 0}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: Administrator role required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /admin/users/{user_id}/promote-organizer:
    post:
      tags: [Administration]
      summary: Promote an attendee to organizer
      description: Requires an administrator. Repeating a promotion for an organizer returns the unchanged organizer.
      security:
        - AccessTokenCookie: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Organizer account returned.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid or self-targeted promotion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Administrator role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Target account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Target role cannot be promoted to organizer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    get:
      tags: [Events]
      summary: List events
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: q
          description: Optional search text.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Events and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Events]
      summary: Create an event
      security:
        - AccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, ends_at, capacity]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Backend Developers Meetup
                description:
                  type: string
                  nullable: true
                location:
                  type: string
                  nullable: true
                  maxLength: 255
                starts_at:
                  type: string
                  format: date-time
                  description: ISO 8601 datetime with an explicit timezone.
                  example: "2026-11-01T09:00:00+00:00"
                ends_at:
                  type: string
                  format: date-time
                  example: "2026-11-01T11:00:00+00:00"
                capacity:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [draft, published, cancelled, completed]
                  default: draft
      responses:
        "201":
          description: Event created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "400":
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{event_id}:
    parameters:
      - in: path
        name: event_id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Events]
      summary: Get an event
      responses:
        "200":
          description: Event returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "404":
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [Events]
      summary: Update an event
      description: Requires a version field for optimistic concurrency control.
      security:
        - AccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                location:
                  type: string
                  nullable: true
                  maxLength: 255
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [draft, published, cancelled, completed]
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Event updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "400":
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the event creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Concurrent update conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcurrencyConflict"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Events]
      summary: Delete an event
      security:
        - AccessTokenCookie: []
      responses:
        "204":
          description: Event deleted.
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the event creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Event has related records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{event_id}/capacity:
    get:
      tags: [Events]
      summary: Get current event seat availability
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Capacity snapshot counts only active registrations.
          content:
            application/json:
              schema:
                type: object
                required: [capacity, occupied, available]
                properties:
                  capacity: {type: integer, minimum: 1}
                  occupied: {type: integer, minimum: 0}
                  available: {type: integer, minimum: 0}
        "404":
          description: Event not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /events/mine:
    get:
      tags: [Events]
      summary: List the authenticated creator's events
      security:
        - AccessTokenCookie: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: q
          schema: {type: string, minLength: 1, maxLength: 200}
        - in: query
          name: status
          schema: {type: string, enum: [draft, published, cancelled, completed]}
      responses:
        "200":
          description: Owner-filtered events and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [events, pagination]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/Event"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400":
          description: Invalid query parameters or client-supplied owner identifier.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /events/mine/summary:
    get:
      tags: [Events]
      summary: Get event activity metrics for the authenticated creator
      description: >-
        Upcoming counts draft or published events whose start time is after the current UTC instant.
        Active counts draft or published events whose interval contains that instant. Finished counts
        completed events or non-cancelled events whose end time has passed. Cancelled events are not
        included in finished. Status percentages use all of the creator's events as their denominator.
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Owner-scoped event totals, date metrics, status counts, and percentages.
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: object
                    required: [total_events, upcoming_events, active_events, finished_events, cancelled_events, status_counts, status_percentages]
                    properties:
                      total_events: {type: integer, minimum: 0}
                      upcoming_events: {type: integer, minimum: 0}
                      active_events: {type: integer, minimum: 0}
                      finished_events: {type: integer, minimum: 0}
                      cancelled_events: {type: integer, minimum: 0}
                      status_counts:
                        type: object
                        additionalProperties: {type: integer, minimum: 0}
                      status_percentages:
                        type: object
                        additionalProperties: {type: number, minimum: 0, maximum: 100}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /events/mine/metrics:
    get:
      tags: [Events]
      summary: Get owner-only event management metrics
      description: Returns status totals and a bounded set of the authenticated creator's events with session and active registration counts.
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Owner-scoped event metrics.
          content:
            application/json:
              schema:
                type: object
                required: [summary, events]
                properties:
                  summary:
                    type: object
                    description: Existing owner dashboard counts plus active_registrations.
                  events:
                    type: array
                    maxItems: 6
                    items:
                      allOf:
                        - {$ref: "#/components/schemas/Event"}
                        - type: object
                          required: [session_count, active_registrations, available_seats]
                          properties:
                            session_count: {type: integer, minimum: 0}
                            active_registrations: {type: integer, minimum: 0}
                            available_seats: {type: integer, minimum: 0}
        "401":
          description: Authentication required.
        "403":
          description: Organizer or administrator role required.

  /events/mine/{event_id}:
    get:
      tags: [Events]
      summary: Get an event through its owner-only management route
      security:
        - AccessTokenCookie: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Event returned to its creator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: {$ref: "#/components/schemas/Event"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: Event does not exist or is not owned by the caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /registrations/me:
    get:
      tags: [Registrations]
      summary: List the current user's event registrations
      description: >-
        Registrations can only be listed for the authenticated user. Period filters use UTC event
        timestamps. A registered record for a past event is not proof of physical attendance.
      security:
        - AccessTokenCookie: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema: {type: string, enum: [registered, cancelled]}
        - in: query
          name: period
          schema: {type: string, enum: [upcoming, active, past]}
      responses:
        "200":
          description: Registrations and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        status:
                          type: string
                        registered_at:
                          type: string
                          format: date-time
                        event:
                          $ref: "#/components/schemas/Event"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: Invalid query parameters or user_id is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /registrations/me/summary:
    get:
      tags: [Registrations]
      summary: Get attendance activity for the authenticated user
      description: A registered record for a past event does not verify physical attendance.
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Registration, upcoming, past-event, and cancelled counts for the current user.
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: object
                    required: [total, active, upcoming, past, cancelled]
                    properties:
                      total: {type: integer, minimum: 0}
                      active: {type: integer, minimum: 0}
                      upcoming: {type: integer, minimum: 0}
                      past: {type: integer, minimum: 0}
                      cancelled: {type: integer, minimum: 0}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /events/recommendations/me:
    get:
      tags: [Events]
      summary: Recommend available upcoming events to the current user
      description: Returns at most eight published future events with confirmed free capacity, excluding events where the current user has an active registration.
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Available upcoming events and verified remaining seats.
          content:
            application/json:
              schema:
                type: object
                required: [recommendations]
                properties:
                  recommendations:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      required: [event, available_seats]
                      properties:
                        event: {$ref: "#/components/schemas/Event"}
                        available_seats: {type: integer, minimum: 1}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /events/{event_id}/registrations/me:
    parameters:
      - in: path
        name: event_id
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Registrations]
      summary: Register the current user for an event
      security:
        - AccessTokenCookie: []
      responses:
        "201":
          description: Registration created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration:
                    type: object
                    properties:
                      id:
                        type: integer
                      event_id:
                        type: integer
                      user_id:
                        type: integer
                      status:
                        type: string
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Event unavailable, capacity exceeded, or duplicate registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Registrations]
      summary: Cancel the current user's event registration
      security:
        - AccessTokenCookie: []
      responses:
        "204":
          description: Registration cancelled.
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or registration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /session-registrations/me:
    get:
      tags: [Sessions]
      summary: List the current user's session registrations
      description: >-
        Returns session registrations belonging to the authenticated account, with associated event
        and session details. A cancelled parent event registration is represented as a cancelled
        session registration even if the child row is inconsistent.
      security:
        - AccessTokenCookie: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: Session registrations and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [registrations, pagination]
                properties:
                  registrations:
                    type: array
                    items:
                      type: object
                      required: [id, status, registered_at, event, session]
                      properties:
                        id: {type: integer}
                        status: {type: string, enum: [active, cancelled]}
                        registered_at: {type: string, format: date-time}
                        event:
                          type: object
                          required: [id, title, status, location]
                          properties:
                            id: {type: integer}
                            title: {type: string}
                            status: {type: string}
                            location:
                              type: string
                              nullable: true
                        session:
                          type: object
                          required: [id, title, description, starts_at, ends_at, capacity]
                          properties:
                            id: {type: integer}
                            title: {type: string}
                            description:
                              type: string
                              nullable: true
                            starts_at: {type: string, format: date-time}
                            ends_at: {type: string, format: date-time}
                            capacity: {type: integer}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400":
          description: Invalid pagination or user_id query parameter.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /events/{event_id}/sessions:
    parameters:
      - in: path
        name: event_id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Sessions]
      summary: List an event's sessions
      responses:
        "200":
          description: Sessions returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "404":
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Sessions]
      summary: Create a session for an event
      security:
        - AccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, ends_at, capacity]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 1
                speaker_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the event creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or speaker not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{event_id}/sessions/{session_id}:
    parameters:
      - in: path
        name: event_id
        required: true
        schema:
          type: integer
          minimum: 1
      - in: path
        name: session_id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Sessions]
      summary: Get a session
      responses:
        "200":
          description: Session returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        "404":
          description: Session or event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [Sessions]
      summary: Update a session
      description: Requires a version field for optimistic concurrency control.
      security:
        - AccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 1
                speaker_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Session updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the event creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session or event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Concurrent update conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcurrencyConflict"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Sessions]
      summary: Delete a session
      security:
        - AccessTokenCookie: []
      responses:
        "204":
          description: Session deleted.
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the event creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session or event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Authentication unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

