repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry -C backend run ruff check --fix
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: poetry -C backend run ruff format
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false
