services:
  db:
    image: postgres:16-alpine
    container_name: mis-eventos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mis_eventos
      POSTGRES_USER: mis_eventos
      POSTGRES_PASSWORD: mis_eventos_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: mis-eventos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://mis_eventos:mis_eventos_dev@db:5432/mis_eventos
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Generate JWT_SECRET_KEY and set it in the root .env file}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-3600}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: mis-eventos-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
