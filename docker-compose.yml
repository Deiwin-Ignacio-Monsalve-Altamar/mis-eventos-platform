services:
  db:
    image: postgres:16-alpine
    container_name: mis-eventos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mis_eventos
      POSTGRES_USER: mis_eventos
      POSTGRES_PASSWORD: mis_eventos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: mis-eventos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://mis_eventos:mis_eventos_dev@db:5432/mis_eventos
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: mis-eventos-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
